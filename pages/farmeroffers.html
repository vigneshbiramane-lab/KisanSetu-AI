<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KisanSetu AI - Farmer Offers</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8f5;
            color: #1d2b3a;
        }

        .navbar {
            height: 75px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e5e5e5;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #087f45;
        }

        .back-btn {
            border: 1px solid #ddd;
            background: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .back-btn:hover {
            background: #f1f7f2;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-title span {
            color: #087f45;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .page-title h1 {
            font-size: 38px;
            margin-top: 10px;
        }

        .page-title p {
            color: #667085;
            margin-top: 10px;
            font-size: 17px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            border: 1px solid #e5ebe7;
        }

        .summary-card span {
            display: block;
            color: #667085;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .summary-card strong {
            font-size: 28px;
            color: #087f45;
        }

        .offers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .offer-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e5ebe7;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .offer-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .crop-name {
            font-size: 23px;
            font-weight: bold;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background: #fff4d6;
            color: #8a6500;
        }

        .accepted {
            background: #e8f7ed;
            color: #087f45;
        }

        .rejected {
            background: #fff0f0;
            color: #b42318;
        }

        .buyer {
            background: #f7f9f8;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .buyer span {
            display: block;
            color: #667085;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .buyer strong {
            font-size: 18px;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-box {
            padding: 13px;
            background: #fafcfb;
            border: 1px solid #edf0ee;
            border-radius: 9px;
        }

        .info-box span {
            display: block;
            color: #667085;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .info-box strong {
            font-size: 15px;
        }

        .offer-price {
            padding: 18px;
            background: #eef8f1;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .offer-price span {
            display: block;
            color: #667085;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .offer-price strong {
            font-size: 26px;
            color: #087f45;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .accept-btn,
        .reject-btn {
            flex: 1;
            padding: 13px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .accept-btn {
            border: none;
            background: #087f45;
            color: white;
        }

        .accept-btn:hover {
            background: #066b3a;
        }

        .reject-btn {
            border: 1px solid #d9d9d9;
            background: white;
            color: #b42318;
        }

        .reject-btn:hover {
            background: #fff5f5;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 55px 20px;
            background: white;
            border-radius: 15px;
            color: #667085;
        }

        .offers .empty {
            grid-column: 1 / -1;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }

        .success {
            display: block;
            background: #e8f7ed;
            color: #087f45;
        }

        .error {
            display: block;
            background: #fff0f0;
            color: #b42318;
        }

        @media (max-width: 750px) {

            .summary {
                grid-template-columns: 1fr;
            }

            .offers {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            🌾 KisanSetu AI
        </div>

        <button
            class="back-btn"
            onclick="goHome()"
        >
            ← Back to Dashboard
        </button>

    </header>



    <!-- MAIN -->

    <main class="container">


        <div class="page-title">

            <span>
                FARMER DASHBOARD
            </span>

            <h1>
                🤝 Buyer Offers
            </h1>

            <p>
                Review offers received from buyers.
            </p>

        </div>



        <!-- SUMMARY -->

        <div class="summary">

            <div class="summary-card">

                <span>
                    Total Offers
                </span>

                <strong id="totalOffers">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    Pending Offers
                </span>

                <strong id="pendingOffers">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    Accepted Offers
                </span>

                <strong id="acceptedOffers">
                    0
                </strong>

            </div>

        </div>



        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- OFFERS -->

        <div
            id="offers"
            class="offers"
        >

            <div class="loading">

                ⏳ Loading buyer offers...

            </div>

        </div>


    </main>



    <script>

        const API_URL =
            "http://127.0.0.1:5000";


        // ==========================================
        // HOME
        // ==========================================

        function goHome() {

            window.location.href =
                "../index.html";

        }



        // ==========================================
        // RUPEE FORMAT
        // ==========================================

        function formatRupees(value) {

            return "₹" +
                Number(value).toLocaleString("en-IN");

        }



        // ==========================================
        // LOAD OFFERS
        // ==========================================

        async function loadOffers() {

            const container =
                document.getElementById(
                    "offers"
                );


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/offers`
                    );


                const data =
                    await response.json();


                console.log(
                    "Offers received:",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load offers."
                    );

                }


                const offers =
                    data.offers || [];


                updateSummary(
                    offers
                );


                displayOffers(
                    offers
                );

            }

            catch (error) {

                console.error(
                    "Offers error:",
                    error
                );


                container.innerHTML = `

                    <div class="empty">

                        <div style="font-size:45px;">
                            ⚠️
                        </div>

                        <h2>
                            Unable to connect
                        </h2>

                        <p>
                            Make sure the KisanSetu Flask
                            backend is running.
                        </p>

                    </div>

                `;

            }

        }



        // ==========================================
        // SUMMARY
        // ==========================================

        function updateSummary(
            offers
        ) {

            const total =
                offers.length;


            const pending =
                offers.filter(
                    function(offer) {

                        return offer.status ===
                            "Pending";

                    }
                ).length;


            const accepted =
                offers.filter(
                    function(offer) {

                        return offer.status ===
                            "Accepted";

                    }
                ).length;


            document.getElementById(
                "totalOffers"
            ).textContent =
                total;


            document.getElementById(
                "pendingOffers"
            ).textContent =
                pending;


            document.getElementById(
                "acceptedOffers"
            ).textContent =
                accepted;

        }



        // ==========================================
        // DISPLAY OFFERS
        // ==========================================

        function displayOffers(
            offers
        ) {

            const container =
                document.getElementById(
                    "offers"
                );


            if (
                !offers ||
                offers.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty">

                        <div style="font-size:45px;">
                            🤝
                        </div>

                        <h2>
                            No buyer offers yet
                        </h2>

                        <p>
                            Offers from buyers will
                            appear here.
                        </p>

                    </div>

                `;

                return;

            }


            container.innerHTML =
                offers.map(
                    function(offer) {


                        let icon = "🌾";


                        if (
                            offer.crop.toLowerCase()
                            === "onion"
                        ) {

                            icon = "🧅";

                        }

                        else if (
                            offer.crop.toLowerCase()
                            === "tomato"
                        ) {

                            icon = "🍅";

                        }

                        else if (
                            offer.crop.toLowerCase()
                            === "potato"
                        ) {

                            icon = "🥔";

                        }


                        let statusClass =
                            "pending";


                        if (
                            offer.status ===
                            "Accepted"
                        ) {

                            statusClass =
                                "accepted";

                        }

                        else if (
                            offer.status ===
                            "Rejected"
                        ) {

                            statusClass =
                                "rejected";

                        }


                        const totalOfferValue =
                            Number(
                                offer.quantity
                            ) *
                            Number(
                                offer.offer_price
                            );


                        let buttons = "";


                        if (
                            offer.status ===
                            "Pending"
                        ) {

                            buttons = `

                                <div class="buttons">

                                    <button
                                        class="accept-btn"
                                        onclick="updateOfferStatus(
                                            ${offer.offer_id},
                                            'Accepted'
                                        )"
                                    >
                                        ✅ Accept Offer
                                    </button>

                                    <button
                                        class="reject-btn"
                                        onclick="updateOfferStatus(
                                            ${offer.offer_id},
                                            'Rejected'
                                        )"
                                    >
                                        ❌ Reject
                                    </button>

                                </div>

                            `;

                        }


                        return `

                            <div class="offer-card">


                                <div class="offer-top">

                                    <div class="crop-name">

                                        ${icon}
                                        ${offer.crop}

                                    </div>

                                    <span
                                        class="status ${statusClass}"
                                    >

                                        ${offer.status}

                                    </span>

                                </div>



                                <div class="buyer">

                                    <span>
                                        Buyer
                                    </span>

                                    <strong>
                                        👤 ${offer.buyer_name}
                                    </strong>

                                </div>



                                <div class="info">


                                    <div class="info-box">

                                        <span>
                                            Listing ID
                                        </span>

                                        <strong>
                                            #${offer.listing_id}
                                        </strong>

                                    </div>


                                    <div class="info-box">

                                        <span>
                                            Location
                                        </span>

                                        <strong>
                                            📍 ${offer.location}
                                        </strong>

                                    </div>


                                    <div class="info-box">

                                        <span>
                                            Quantity
                                        </span>

                                        <strong>
                                            ${offer.quantity}
                                            quintals
                                        </strong>

                                    </div>


                                    <div class="info-box">

                                        <span>
                                            Farmer Expected
                                        </span>

                                        <strong>
                                            ${formatRupees(
                                                offer.expected_price
                                            )}
                                            /q
                                        </strong>

                                    </div>

                                </div>



                                <div class="offer-price">

                                    <span>
                                        Buyer Offer Price
                                    </span>

                                    <strong>
                                        ${formatRupees(
                                            offer.offer_price
                                        )}
                                        / quintal
                                    </strong>

                                </div>



                                <div class="info">

                                    <div class="info-box">

                                        <span>
                                            Total Offer Value
                                        </span>

                                        <strong>
                                            ${formatRupees(
                                                totalOfferValue
                                            )}
                                        </strong>

                                    </div>


                                    <div class="info-box">

                                        <span>
                                            Offer ID
                                        </span>

                                        <strong>
                                            #${offer.offer_id}
                                        </strong>

                                    </div>

                                </div>



                                ${buttons}


                            </div>

                        `;

                    }
                ).join("");

        }



        // ==========================================
        // ACCEPT / REJECT OFFER
        // ==========================================

        async function updateOfferStatus(
            offerId,
            newStatus
        ) {


            const action =
                newStatus === "Accepted"
                    ? "accept"
                    : "reject";


            const confirmed =
                confirm(
                    `Are you sure you want to ${action} this offer?`
                );


            if (!confirmed) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/offers/${offerId}/status`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                status:
                                    newStatus

                            })

                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Status response:",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to update offer."
                    );

                }


                showMessage(
                    `✅ Offer ${newStatus.toLowerCase()} successfully!`,
                    "success"
                );


                loadOffers();

            }

            catch (error) {

                console.error(
                    "Status update error:",
                    error
                );


                showMessage(
                    "⚠️ " +
                    error.message,
                    "error"
                );

            }

        }



        // ==========================================
        // MESSAGE
        // ==========================================

        function showMessage(
            text,
            type
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                text;


            message.className =
                "message " +
                type;


            setTimeout(
                function() {

                    message.style.display =
                        "none";

                },
                3000
            );

        }



        // ==========================================
        // START
        // ==========================================

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                loadOffers();

            }
        );

    </script>


</body>

</html>
